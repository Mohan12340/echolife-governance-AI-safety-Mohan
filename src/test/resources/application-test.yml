spring:
  datasource:
    # MODE=PostgreSQL tells H2 to mimic Postgres syntax to avoid dialect errors
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
      
  # If you are using Flyway for database migrations, disable it for tests
  flyway:
    enabled: false
